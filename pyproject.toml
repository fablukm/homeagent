[project]
name = "homeagent"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "apscheduler>=3.11,<4",
    "structlog>=25",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "prometheus-client>=0.21",
    "python-telegram-bot>=22",
    "ollama>=0.5",
    "anthropic>=0.50",
    "httpx>=0.28",
]

[project.scripts]
homeagent = "homeagent.main:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "ruff>=0.12",
    "pyright>=1.1.400",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"alembic/*" = ["ANN", "E501"]

[tool.pyright]
include = ["src", "scripts", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
