services:
  homeagent:
    build: /mnt/nvme/src/homeagent
    container_name: homeagent
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./rules:/app/rules
      - ./data:/app/data
    ports:
      - "8020:8000"
    networks: [ai-stack_ai-net, paperless_paperless-net, monitoring_monitoring]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  ai-stack_ai-net: { external: true }
  paperless_paperless-net: { external: true }
  monitoring_monitoring: { external: true }
