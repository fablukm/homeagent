[triage]
task_class = "classify"
body_chars = 1500
priority = ["pay", "reply", "appointment", "todo", "keep"]
instructions = """You read one email I received. The first line names the action it needs from me. Write what I need to know to do that action.
Actions, in order of priority ({priority}):
{needs}
none: probably no action; I only check that nothing is needed.

Threads: only the latest message at the top counts. The quoted thread below it is context only.

My preferences:
{preferences}

summary: the task or event in English, at most 10 words.
due_date: the deadline or event date for that action as YYYY-MM-DD, or null when the email names none."""
template = """Action: {action}
From: {sender}
Date: {date}
Subject: {subject}
Attachments: {attachments}

{body}"""

[triage.needs]
reply = "A person is waiting for my written answer: a question addressed to me, a request to confirm, decide or send something (e.g. an association asking for my new address), a request to reschedule a call or meeting, or an invitation that asks me to reply. Not automated or no-reply senders, not newsletters. Example: the Kita asks whether my child comes on 24.12."
pay = "I still have to pay money: an open invoice, bill, QR bill, eBill to approve, payment reminder. Not receipts, payment confirmations, orders already paid, or amounts debited or reserved automatically (e.g. a card amount reserved and charged later). Example: dentist invoice payable within 30 days."
todo = "Another concrete task only I can do, other than replying or paying: book, register, sign, fill in or submit a form, renew, cancel, order, call someone, download a document that waits in a portal. Not confirmations I triggered myself and handle at once, such as verifying an email address or checking in online. Not optional surveys or feedback requests. Example: book holiday care at the Kita for 24.12."
appointment = "A dated event I attend or must be present for, so it belongs in my calendar: doctor, Kita or school event, meeting, official appointment, and time slots I booked myself where I must be home, such as a delivery window or a workman's visit. Not tickets, hotels or restaurants, and not events of family members that I do not attend. Example: parent evening on 27.11. at 19:30."
keep = "The email itself carries a document worth filing, attached or in its text: invoice, receipt or ticket with a price, contract, policy, statement, certificate, payslip, tax or medical document. A document that only waits in a portal is todo. Not marketing, newsletters (even as PDF attachments), or plain notifications. Example: annual insurance statement as PDF."

[triage.laya]
backend = "laya"
question = "action"
instructions = "Which single action does this email I received need from me?"
check_below = 0.9

[triage.laya.criteria]
none = "No action: the email only informs, advertises, or confirms something already done. Most emails need none."
pay = "I still have to pay money: an open invoice, bill, QR bill, eBill to approve, payment reminder. Not receipts, payment confirmations, orders already paid, or amounts debited automatically. Example: dentist invoice payable within 30 days."
reply = "A person is waiting for my written answer: a question to me, a request to confirm, decide or send something, an invitation that asks me to reply. Not automated or no-reply senders, not newsletters. Example: the Kita asks whether my child comes on 24.12."
appointment = "A dated event I attend or must be present for, so it belongs in my calendar: doctor, Kita or school event, meeting, official appointment, and time slots I booked myself where I must be home, such as a delivery window or a workman's visit. Not tickets, hotels or restaurants, and not events of family members that I do not attend. Example: parent evening on 27.11. at 19:30."
todo = "Another concrete task only I can do, other than replying or paying: book, register, sign, fill in or submit a form, renew, cancel, order, call someone, download a document that waits in a portal. Not confirmations I triggered myself and handle at once, such as verifying an email address or checking in online. Example: book holiday care at the Kita for 24.12."
keep = "The email itself carries a document worth filing, attached or in its text: invoice, receipt or ticket with a price, contract, policy, statement, certificate, payslip, tax or medical document. A document that only waits in a portal is todo. Not marketing or plain notifications. Example: annual insurance statement as PDF."

[[triage.skip]]
reason = "calendar invitation"
field = "subject"
pattern = '(?i)^\s*(Updated invitation|Invitation|Accepted|Declined|Tentatively accepted)( with note)?:'

[[triage.skip]]
reason = "calendar file attached"
field = "attachments"
pattern = '(?im)\.ics$'

