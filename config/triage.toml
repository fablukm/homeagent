[triage.rules]
deadline_actions = ["pay", "reply", "todo"]
strong_deadline = '(?i)(zahlbar|fällig|faellig|zahlungsfrist|spätestens|spaetestens|bis zum|bis am|innert|innerhalb|frist|deadline|due|payable|à payer|a payer|avant le|délai|delai|until|by |bis |expires?|ablauf|läuft|gültig|valid|anmeldeschluss|einsendeschluss|jusqu)'
not_deadline = '(?i)(termin|uhr\b|\d{1,2}[:.]\d{2}|appointment|rendez|lieferung|geliefert|delivery|livraison|rechnungsdatum|invoice date|datum:|date:|öffnungszeit|opening|bestell|order date|versand|shipped|geöffnet|ouvert|prochaine)'
reminder = '(?i)(mahnung|zahlungserinnerung|reminder|overdue|überfällig|rappel)'
invoice_number = '(?i)(rechnung|invoice|facture)\D{0,30}?(?P<number>\b[a-z]{0,4}-?\d[\d-]{4,}[a-z0-9-]*)'
org_noise = '(?i)\b(ag|gmbh|sa|customer service|kundendienst|service|info|team|notifications?)\b'
pay_task = "Pay {org} invoice {number}"
description = "Mail from {sender}, {date}: {subject}"
description_date = "%d.%m.%Y"
private_domains = ["gmail.com", "googlemail.com", "gmx.ch", "gmx.net", "gmx.de", "bluewin.ch", "hotmail.com", "hotmail.ch", "outlook.com", "outlook.de", "live.com", "icloud.com", "me.com", "yahoo.com", "yahoo.de", "web.de", "sunrise.ch", "hispeed.ch", "protonmail.com", "proton.me", "yandex.ru", "yandex.com", "mail.ru"]
invoice_days = 10
sunday_margin = 3

[triage.prompts]
field = "[[ ## {name} ## ]]\n{value}"
indent = "        "
day = "%d/%m/%Y"
received = "%a %d/%m/%Y"
date_line = "- {day:%d/%m/%Y} ({day:%a}): {quote}"

[triage.prompts.task]
system = '''
Your input fields are:
1. `about_me` (str): 
2. `action` (str): 
3. `sender` (str): 
4. `subject` (str): 
5. `attachments` (str): 
6. `body` (str):
Your output fields are:
1. `task` (str): English, imperative, at most 10 words
All interactions will be structured in the following way, with the appropriate values filled in.

Inputs will have the following structure:

[[ ## about_me ## ]]
{{about_me}}

[[ ## action ## ]]
{{action}}

[[ ## sender ## ]]
{{sender}}

[[ ## subject ## ]]
{{subject}}

[[ ## attachments ## ]]
{{attachments}}

[[ ## body ## ]]
{{body}}

Outputs will be a JSON object with the following fields.

{{
  "task": "{{task}}"
}}
In adhering to this structure, your objective is: 
{instructions}'''
closing = '''Respond with a JSON object in the following order of fields: `task`.'''

[triage.prompts.deadline]
system = '''
Your input fields are:
1. `action` (str): 
2. `received` (str): when the email arrived; this is today
3. `sender` (str): 
4. `subject` (str): 
5. `body` (str): 
6. `dates` (str): dates found in the email, with the words around each
Your output fields are:
1. `needs_deadline` (bool): does this task have a deadline I must meet?
2. `deadline` (str): one of the listed dates copied as dd/mm/yyyy, or none
3. `relation` (Literal['last_day', 'event']):
All interactions will be structured in the following way, with the appropriate values filled in.

Inputs will have the following structure:

[[ ## action ## ]]
{{action}}

[[ ## received ## ]]
{{received}}

[[ ## sender ## ]]
{{sender}}

[[ ## subject ## ]]
{{subject}}

[[ ## body ## ]]
{{body}}

[[ ## dates ## ]]
{{dates}}

Outputs will be a JSON object with the following fields.

{{
  "needs_deadline": "{{needs_deadline}}        # note: the value you produce must be True or False",
  "deadline": "{{deadline}}",
  "relation": "{{relation}}        # note: the value you produce must exactly match (no extra characters) one of: last_day; event"
}}
In adhering to this structure, your objective is: 
{instructions}'''
closing = '''Respond with a JSON object in the following order of fields: `needs_deadline` (must be formatted as a valid Python bool), then `deadline`, then `relation` (must be formatted as a valid Python Literal['last_day', 'event']).'''
