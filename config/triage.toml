outlook_header = '(?im)^\s*(von|from|de)\s*:.*\n(.*\n){0,2}\s*(gesendet|sent|envoyé|date)\s*:'
forward = '(?i)(forwarded message|weitergeleitete nachricht|message transféré|begin forwarded)'
forward_lookback = 200
quote_prefix = ">"
footer = '(?i)(unsubscribe|abmelden|abbestellen|désinscri|desinscri|datenschutz|privacy|impressum|this e-?mail (is|was|and|may)|diese e-?mail (ist|wurde|enthält|kann)|vertraulich|confidential|follow us|folgen sie uns|app store|google play|im browser|view in browser|web-?version)'
