[triage]
task_class = "classify"
body_chars = 1500
template = """You read one email I received and decide which actions it needs from me.
Actions, pick every one that applies:
{needs}
Pick none when the email only informs, advertises, or confirms something already done. Most emails need none.
due_date: the deadline or event date for the action as YYYY-MM-DD, or null when the email names none.
summary: the task or event in English, at most 10 words, e.g. "Pay dentist invoice CHF 180".

From: {sender}
Date: {date}
Subject: {subject}

{body}"""

[triage.needs]
reply = "A person is waiting for my written answer: a question to me, a request to confirm, decide or send something, an invitation that asks me to reply. Not automated or no-reply senders, not newsletters. Example: the Kita asks whether my child comes on 24.12."
pay = "I still have to pay money: an open invoice, bill, QR bill, eBill to approve, payment reminder. Not receipts, payment confirmations, orders already paid, or amounts debited automatically. Example: dentist invoice payable within 30 days."
todo = "Another concrete task only I can do, other than replying or paying: book, register, sign, fill in or submit a form, renew, cancel, order, call someone, download a document that waits in a portal. Not confirmations I triggered myself and handle at once, such as verifying an email address or checking in online. Example: book holiday care at the Kita for 24.12."
appointment = "A dated event I attend or must be present for, so it belongs in my calendar: doctor, Kita or school event, meeting, official appointment, and time slots I booked myself where I must be home, such as a delivery window or a workman's visit. Not tickets, hotels or restaurants, and not events of family members that I do not attend. Example: parent evening on 27.11. at 19:30."
keep = "The email itself carries a document worth filing, attached or in its text: invoice, receipt or ticket with a price, contract, policy, statement, certificate, payslip, tax or medical document. A document that only waits in a portal is todo. Not marketing or plain notifications. Example: annual insurance statement as PDF."
