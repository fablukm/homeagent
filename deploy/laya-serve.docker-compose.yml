services:
  laya-serve:
    build:
      context: /mnt/nvme/src/homeagent/deploy
      dockerfile: laya-serve.Dockerfile
    image: laya-serve:0.4.31
    container_name: laya-serve
    restart: unless-stopped
    environment:
      LAYA_EXTRA_MODELS: '{"triage": "/models/triage"}'
      LAYA_DEFAULT_MODEL: triage
      LAYA_MODELS: triage
      LAYA_THREADS: "4"
    volumes:
      - ./laya/triage:/models/triage:ro
    networks: [ai-net]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
